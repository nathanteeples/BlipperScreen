#
# DO NOT EDIT THIS FILE USE KlipperScreen.conf
#

[main]

[preheat PLA]
bed = 40
extruder = 195

[preheat ABS]
bed = 90
extruder = 220

[preheat PETG]
bed = 80
extruder = 240

[preheat FLEX]
bed = 0
extruder = 210

[include main_menu.conf]
[include splash_menu.conf]
[include print_menu.conf]

[include move_menu.conf]
# Enable GUI/printer sound event forwarding
# sounds_enable: False
# sounds_mute: False
# sounds_volume: 100
# sounds_output: both  # audio|serial|both
# Optional command template for local audio output; {keyword} is replaced with event keyword
# sounds_command:
# Optional serial bridge TTY path. If set, KlipperScreen writes "sound <keyword>\n" per event
# sounds_serial_enable: False
# sounds_serial_device:
# Encoding used for serial bridge lines
# sounds_serial_encoding: ascii

